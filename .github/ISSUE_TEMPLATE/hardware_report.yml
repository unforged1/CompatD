name: Hardware test report
description: Tell us how CompatD works on your machine, good or bad
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        Reports from every machine help, especially Debian and MX Linux, which haven't been tested on real hardware yet.

        The easiest way to fill this in is **☰ → Send test report** in CompatD. It fills in the fields below for you to review.
  - type: dropdown
    id: distro
    attributes:
      label: Distribution
      options:
        - Debian
        - MX Linux
        - LMDE
        - Kali Linux
        - Other Debian-based
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: Output of `compatd info`
      render: text
    validations:
      required: true
  - type: textarea
    id: drivers
    attributes:
      label: Output of `compatd drivers`
      render: text
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: Output of `compatd system`
      render: text
  - type: textarea
    id: performance
    attributes:
      label: Performance and errors
      description: Filled in automatically by CompatD's "Send test report" (☰ menu). Leave empty if you're not using it.
      render: text
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Everything detected correctly
        - Mostly right, some problems (describe below)
        - Wrong or broken (describe below)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What was wrong or missing?
      description: Wrong drivers, missing recommendations, false findings, theme problems, anything else.
